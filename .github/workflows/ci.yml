name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Required files and whitespace
        run: |
          set -eu
          for file in README.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md docs/adr/README.md deploy/README.md; do
            test -s "$file"
          done
          git diff-tree --check --root -r HEAD
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|refactor|perf|docs|test|chore|ci|build|revert)(\([[:alnum:]_. /-]+\))?!?: .+'
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --no-banner --redact --exit-code 1
